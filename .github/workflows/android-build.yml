name: Android APK Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: both
        type: choice
        options: [both, debug, release]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            {
              echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent release signing is configured."
          else
            echo "No release keystore secrets configured; Gradle may produce an unsigned release APK."
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon --stacktrace assembleDebug
          else gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon --stacktrace assembleRelease
          else gradle --no-daemon --stacktrace assembleRelease
          fi

      - name: List generated APKs
        if: always()
        run: find . -path '*/build/outputs/apk/*.apk' -type f -print || true

      - name: Upload Debug APK
        if: ${{ always() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both') && hashFiles('**/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        if: ${{ always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') && hashFiles('**/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: warn
          retention-days: 14
