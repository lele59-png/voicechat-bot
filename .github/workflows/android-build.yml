name: Android APK Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: both
        type: choice
        options: [both, debug, release]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list | head -80 || true
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: gradle --no-daemon --stacktrace --warning-mode all assembleRelease
      - name: List generated APKs
        if: always()
        run: find . -path '*/build/outputs/apk/*.apk' -type f -print || true
      - name: Upload Debug APK
        if: ${{ always() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both') && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Release APK
        if: ${{ always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') && hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
